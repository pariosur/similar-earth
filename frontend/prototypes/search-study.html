<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Similar Earth search prototype</title>
<style>
:root{color-scheme:dark;--bg:#12121a;--panel:#171923;--line:#ffffff18;--muted:#a2a4b2;--gold:#e3b448;--blue:#18384a}*{box-sizing:border-box}body{margin:0;background:#090e13;color:#f4f3ee;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.app{height:100dvh;display:flex;overflow:hidden}.panel{width:380px;flex:none;background:#12121aee;border-right:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:20px;z-index:2}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:15px;letter-spacing:.16em;margin:0;text-transform:uppercase}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.17em;margin-top:3px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.intro h2{font-size:22px;line-height:1.2;margin:7px 0}.intro p,.hint{color:var(--muted);font-size:12px;margin:0}.prompt{border:1px solid #ffffff28;background:#1c1e29;padding:12px;border-radius:9px}.prompt textarea{background:none;border:0;resize:none;color:white;font:inherit;width:100%;height:56px;outline:0}.prompt footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.send{background:var(--gold);color:#14151b;border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer}.examples{display:flex;flex-direction:column;gap:8px}.example{border:1px solid var(--line);border-radius:7px;background:#ffffff05;color:#ddd;text-align:left;padding:10px 12px;cursor:pointer}.example:hover,.result:hover{border-color:#e3b44888}.section-title{font-size:10px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.results{display:flex;flex-direction:column;gap:9px;overflow:auto}.result{border:1px solid var(--line);border-radius:8px;padding:11px;background:#ffffff05}.result-top{display:flex;justify-content:space-between;font-weight:650}.score{color:var(--gold);font-size:12px}.result p{margin:4px 0 10px;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px}.actions button{background:transparent;border:1px solid #ffffff2b;color:#f4f3ee;border-radius:5px;padding:6px 9px;font-size:11px;cursor:pointer}.actions button:first-child{background:var(--gold);color:#14151b;border-color:var(--gold);font-weight:700}.map{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 55% 48%,#24404a 0%,#15252d 52%,#111b20 100%)}.map:before{content:"";position:absolute;inset:-15%;opacity:.5;background-image:linear-gradient(30deg,transparent 49.7%,#e3b44819 50%,transparent 50.3%),linear-gradient(150deg,transparent 49.7%,#ffffff0b 50%,transparent 50.3%);background-size:110px 90px;transform:rotate(-8deg)}.land{position:absolute;inset:0;width:100%;height:100%;opacity:.86}.map-label{position:absolute;color:#e4e4d8a8;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.map-controls{position:absolute;right:20px;top:20px;display:grid;gap:8px}.map-controls button{width:38px;height:38px;background:#121821dd;border:1px solid var(--line);color:#eee;border-radius:6px;font-size:18px}.map-caption{position:absolute;bottom:16px;right:18px;color:#b7c2c5;font-size:10px;background:#101820aa;padding:6px 9px;border-radius:4px}.marker{position:absolute;width:13px;height:13px;border:2px solid #fff;background:var(--gold);border-radius:50%;box-shadow:0 0 0 6px #e3b44844,0 0 18px #e3b448}.marker.m1{left:54%;top:39%}.marker.m2{left:58%;top:45%;background:#e77f43;box-shadow:0 0 0 6px #e77f4344}.marker.m3{left:62%;top:49%;background:#db6250;box-shadow:0 0 0 6px #db625044}.map-chip{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:#111923dd;border:1px solid var(--line);padding:9px 14px;border-radius:20px;font-size:11px;color:#ddd;white-space:nowrap}.variant-b .panel{position:absolute;left:18px;top:18px;bottom:18px;height:auto;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 50px #0008}.variant-b .map{width:100%}.variant-b .map-chip{top:auto;bottom:22px;left:50%;}.variant-c .panel{position:absolute;left:50%;top:16px;bottom:auto;transform:translateX(-50%);width:min(680px,calc(100% - 32px));height:auto;padding:12px;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 50px #0008;gap:0}.variant-c .brand,.variant-c .intro,.variant-c .panel>.section-title,.variant-c .panel>.hint,.variant-c .examples{display:none}.variant-c .results{position:fixed;left:16px;right:16px;bottom:16px;flex-direction:row;justify-content:center;overflow-x:auto;z-index:3}.variant-c .result{min-width:250px;background:#121821f2;box-shadow:0 10px 30px #0008}.variant-c .map{flex:1}.variant-label{position:fixed;z-index:10;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#f4f3ee;color:#171821;padding:8px 13px;border-radius:30px;box-shadow:0 5px 25px #0008;font-size:12px}.variant-label button{border:0;background:none;font-size:18px;cursor:pointer}.variant-label strong{min-width:170px;text-align:center}.mobile-note{display:none}@media(max-width:720px){.app{display:block}.map{position:absolute;inset:0}.panel{position:absolute;left:10px;right:10px;bottom:10px;width:auto;max-height:68dvh;border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;box-shadow:0 12px 40px #0008}.variant-b .panel{top:10px;bottom:58px}.variant-c .panel{top:10px;left:10px;right:10px;bottom:auto;width:auto;transform:none}.variant-c .results{left:10px;right:10px;bottom:54px;justify-content:flex-start}.variant-c .result{min-width:230px}.intro p{display:none}.examples{display:grid;grid-template-columns:1fr 1fr}.variant-label{bottom:6px}.map-chip{top:16px}}
</style></head>
<body><main id="app" class="app"></main><div class="variant-label"><button id="prev" aria-label="Previous design">‹</button><strong id="variant-name"></strong><button id="next" aria-label="Next design">›</button></div>
<script>
// Throwaway UI study: three ways to put natural-language search beside the existing map.
const variants=[['A','Sidebar search'],['B','Floating map panel'],['C','Results-first split']];let current=Math.max(0,variants.findIndex(v=>v[0]===new URLSearchParams(location.search).get('variant')));let searched=false;
const results=[['Alentejo, Portugal','87%','2.1°C warmer · Outside Europe'],['Central Valley, Chile','82%','4.8°C warmer · South America'],['Mendoza, Argentina','79%','3.6°C warmer · South America']];
function cards(){return `<div class="section-title">Matches · ranked by satellite similarity</div><div class="results">${results.map((r,i)=>`<article class="result"><div class="result-top"><span>${r[0]}</span><span class="score">${r[1]}</span></div><p>${r[2]}</p><div class="actions"><button onclick="alert('Prototype: center map on ${r[0]}')">View on map</button><button onclick="alert('Prototype: explore similarity from ${r[0]}')">Explore similar</button></div></article>`).join('')}</div>`}
function render(){let [key,name]=variants[current];document.getElementById('variant-name').textContent=`${key} · ${name}`;const query=searched?`<div class="section-title">You asked</div><p class="hint">Find places like Tuscany, but warmer and outside Europe.</p>${cards()}`:'';document.getElementById('app').className=`app variant-${key.toLowerCase()}`;document.getElementById('app').innerHTML=`<aside class="panel"><header class="brand"><div><h1>Similar Earth</h1><small>GLOBAL SIMILARITY MAPS</small></div><span class="hint">How it works</span></header><section class="intro"><div class="eyebrow">Explore by describing</div><h2>Where would you like to find?</h2><p>Describe a place you know and what kind of places you want to discover.</p></section>${query}<section class="prompt"><textarea id="query" placeholder="Describe the kind of place you're looking for…">${searched?'Find places like Tuscany, but warmer and outside Europe.':''}</textarea><footer><span>Satellite similarity · 2 km</span><button id="send" class="send">${searched?'Search again':'Find places →'}</button></footer></section>${!searched?`<div class="section-title">Try an example</div><div class="examples"><button class="example">Places like Tuscany, but warmer</button><button class="example">Find coffee-growing regions</button><button class="example">Similar mangroves outside Asia</button></div>`:''}<p class="hint">Your map stays here. Results are based on satellite conditions.</p></aside><section class="map" aria-label="Map preview"><svg class="land" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice"><g fill="#55665a" stroke="#839082" stroke-width="1.5"><path d="M92 122l50-38 73-9 42 24 22 48-26 26-5 35-25 33-21 64-31 29-29-20-17-48-28-27-14-61zM246 338l36 13 29 51-9 53-24 62-24 48-17-32 3-59-18-55zM457 121l56-31 66 4 33 26 52-12 69 23 47-1 63 31 20 44-37 27-20 54-46 7-35-31-47 14-29-27-50 6-22-26-42 8-30-38-39-10-16-40zM523 301l57-22 42 21 24 60-21 49-26 81-36 58-27-23-17-73-25-55 5-55zM794 387l47-21 36 13 22 38-31 27-54-6-24-23z"/></g><path d="M0 302h1000M500 0v600" stroke="#d8e0cf" stroke-opacity=".12" stroke-dasharray="3 8" fill="none"/></svg><span class="map-label" style="left:15%;top:47%">Pacific Ocean</span><span class="map-label" style="left:69%;top:65%">Indian Ocean</span><span class="map-label" style="left:48%;top:30%">Europe</span><span class="map-chip">${searched?'3 warmer matches · filters applied':'Map remains visible while you search'}</span>${searched?'<i class="marker m1"></i><i class="marker m2"></i><i class="marker m3"></i>':''}<div class="map-controls"><button>＋</button><button>−</button></div><span class="map-caption">Map illustration · prototype</span></section>`;document.querySelectorAll('.example').forEach(b=>b.onclick=()=>{document.getElementById('query').value=b.textContent;searched=true;render()});document.getElementById('send').onclick=()=>{searched=true;render()}}
function move(n){current=(current+n+variants.length)%variants.length;history.replaceState(null,'',`?variant=${variants[current][0]}`);render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);window.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});render();
</script></body></html>
